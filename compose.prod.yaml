services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: atlas_finance
      MYSQL_USER: atlas
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - atlas-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - atlas

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      APP_ENV: production
      APP_DEBUG: "false"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - atlas-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - atlas

volumes:
  atlas-mysql:
  atlas-storage:

networks:
  atlas:
    driver: bridge
