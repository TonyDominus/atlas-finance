services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: atlas_finance
      MYSQL_USER: atlas
      MYSQL_PASSWORD: atlas
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - atlas-mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: atlas_finance
      DB_USERNAME: atlas
      DB_PASSWORD: atlas
    depends_on:
      mysql:
        condition: service_healthy

  vite:
    image: node:22-bookworm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

volumes:
  atlas-mysql:
